name: publish

# Publishes @leviosa-ai/konva to the public npm registry when a version tag is pushed.
#   git tag vX.Y.Z && git push origin vX.Y.Z
# Authentication uses npm Trusted Publishing (OIDC); no npm token is stored in GitHub.
on:
  push:
    tags:
      - "v*"

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
          scope: "@leviosa-ai"
          package-manager-cache: false

      - run: npm ci

      - run: npm run build

      # Fails loudly if package.json version != the pushed tag (vX.Y.Z).
      - name: Verify tag matches package version
        run: |
          PKG=$(node -p "require('./package.json').version")
          TAG=${GITHUB_REF_NAME#v}
          if [ "$PKG" != "$TAG" ]; then
            echo "::error::package.json version ($PKG) != tag ($TAG)"; exit 1
          fi

      - run: npm publish
